# Private 5900xt deployment. Keep compose.yaml close to upstream.
services:
  tuwunel:
    image: ${MINDROOM_TUWUNEL_IMAGE:-ghcr.io/mindroom-ai/mindroom-tuwunel@sha256:4dc1738d80156b5250879cd76bbacb2a8b0ff2db53edde4fe2a3f24e45ad2175}
    environment:
      TUWUNEL_SERVER_NAME: matrix.walrus-bebop.ts.net
      TUWUNEL_WELL_KNOWN__CLIENT: https://matrix.walrus-bebop.ts.net
      TUWUNEL_ALLOW_REGISTRATION: "true"
      TUWUNEL_REGISTRATION_TOKEN: ${MATRIX_REGISTRATION_TOKEN:?Set the private registration token in .env}
      TUWUNEL_YES_I_AM_VERY_VERY_SURE_I_WANT_AN_OPEN_REGISTRATION_SERVER_PRONE_TO_ABUSE: "false"
      TUWUNEL_ALLOW_GUEST_REGISTRATION: "false"
      TUWUNEL_ALLOW_FEDERATION: "false"
      TUWUNEL_AUTO_JOIN_ROOMS: "[]"
    ports: !override
      - "127.0.0.1:${HOST_HOMESERVER_PORT:-8008}:8008"

  mindroom-permissions:
    image: ${MINDROOM_IMAGE:-ghcr.io/mindroom-ai/mindroom@sha256:adaf692c4e5f5bacabca66363f56d8037321f35c4d0c31153f208322a37a489c}
    volumes:
      - ./runtime/config:/app/config

  mindroom:
    image: mindroom-local:2026.9.231-dashboard-fixes-v2
    # Build from the pinned upstream image; cached rebuilds do not fetch latest.
    pull_policy: build
    build:
      context: ./deployment/mindroom
      args:
        MINDROOM_BASE_IMAGE: ${MINDROOM_IMAGE:-ghcr.io/mindroom-ai/mindroom@sha256:adaf692c4e5f5bacabca66363f56d8037321f35c4d0c31153f208322a37a489c}
    environment:
      MATRIX_SERVER_NAME: matrix.walrus-bebop.ts.net
      # Bind this single-owner dashboard to its existing Matrix administrator.
      MINDROOM_OWNER_USER_ID: "@jeff:matrix.walrus-bebop.ts.net"
      MATRIX_REGISTRATION_TOKEN: ${MATRIX_REGISTRATION_TOKEN:?Set the private registration token in .env}
      # MindRoom's OpenAI-compatible adapter authenticates to Meta's endpoint.
      OPENAI_API_KEY: ${META_API_KEY:?Set the Meta API key in .env}
    volumes:
      - ./runtime/config:/app/config
      - ./runtime/workspace:/app/mindroom_data/agents/mind/workspace
    ports: !override
      - "127.0.0.1:${HOST_DASHBOARD_PORT:-8765}:8765"

  client:
    image: ${MINDROOM_CLIENT_IMAGE:-ghcr.io/mindroom-ai/mindroom-chat@sha256:2c1cdaa0f6fbf1a16db7cdd4adcd285d7d0258d2b5a32bbfc3fc7ebdfda6975a}
    environment:
      CLIENT_HOMESERVER_URL: https://matrix.walrus-bebop.ts.net
      MINDROOM_DASHBOARD_URL: https://mindroom-admin.walrus-bebop.ts.net
    volumes:
      - ./deployment/client-config.json:/app/config.template.json:ro
    ports: !override
      # Transit already owns 8080. The public-facing URL has no port number.
      - "127.0.0.1:${HOST_CLIENT_PORT:-8240}:80"

networks:
  default:
    ipam:
      config:
        # Checked against host routes and every existing Docker network.
        - subnet: 10.91.0.0/24
